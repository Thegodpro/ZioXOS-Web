<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Configuración de Identidad - ZioXOS</title>
    <style>
        @font-face {
            font-family: ZioXFont;
            src: url(font/ZioXOS_Font_Oficial.ttf);
        }

        /* =========================================================
           VARIABLES MAESTRAS (Ecosistema ZioXOS)
           ========================================================= */
        :root {
            --bg-color: rgb(255, 94, 0);
            --bg-gradient: linear-gradient(135deg, rgb(255, 94, 0) 0%, rgb(255, 140, 0) 100%);
            --text: #ffffff;
            --nav-bg: rgba(255, 255, 0, 0.3);
            --nav-blur: blur(15px);
            --card-bg: rgba(255, 255, 255, 0.12);
            --card-border: rgba(255, 255, 255, 0.25);
            --accent: #ffcc00;
            --shadow-glow: rgba(255, 204, 0, 0.4);
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            --nav-height: 70px;
        }

        .dark-mode {
            --bg-color: #0f0f0f;
            --bg-gradient: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            --text: #f0f0f0;
            --nav-bg: rgba(20, 20, 20, 0.6);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent: #ff6a00;
        }

        body {
            margin: 0;
            font-family: ZioXFont, system-ui, sans-serif;
            background: var(--bg-color);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text);
            text-align: center;
            transition: background 0.5s ease;
            min-height: 100vh;
            padding-top: var(--nav-height);
        }

        /* =========================================================
           NAVBAR BASE
           ========================================================= */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0px 40px; height: var(--nav-height);
            background: var(--nav-bg); backdrop-filter: var(--nav-blur);
            -webkit-backdrop-filter: var(--nav-blur);
            border-bottom: 1px solid var(--card-border);
            position: fixed; top: 0; left: 0; width: 100%; z-index: 3000;
            transition: var(--transition);
            box-sizing: border-box;
        }
        
        .logo { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: bold; text-decoration: none; color: var(--text); transition: var(--transition); }
        .logo:hover { transform: scale(1.05); color: var(--accent); }
        .logo img { height: 57px; }

        .nav-links { display: flex; align-items: center; gap: 15px; transition: var(--transition); }
        .nav-links a { color: var(--text); text-decoration: none; padding: 8px 16px; border-radius: 12px; transition: var(--transition); }
        .nav-links a:hover { background: var(--card-bg); }
        .nav-links a.active { background: var(--accent); color: #000; font-weight: bold; }
        
        #avatarNav { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--accent); cursor: pointer; display: none; object-fit: cover; transition: var(--transition); }
        #avatarNav:hover { transform: scale(1.1); box-shadow: 0 0 15px var(--accent); }

        /* Estilos Dinámicos Navbar */
        .navbar.estilo-animado .nav-links a, .navbar.estilo-animado .logo { position: relative; background: transparent !important; }
        .navbar.estilo-animado .nav-links a::after, .navbar.estilo-animado .logo::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
            background: var(--accent); transform: scaleX(0); transition: 0.4s; transform-origin: right;
        }
        .navbar.estilo-animado .nav-links a:hover::after, .navbar.estilo-animado .logo:hover::after { transform: scaleX(1); transform-origin: left; }

        .navbar.estilo-cajas { background: transparent !important; border-bottom: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; top: 15px !important; }
        .navbar.estilo-cajas .logo, .navbar.estilo-cajas .nav-links {
            background: rgba(40, 40, 40, 0.4) !important; backdrop-filter: blur(20px) !important; -webkit-backdrop-filter: blur(20px) !important;
            border: 1px solid var(--card-border) !important; border-radius: 40px !important; padding: 5px 25px !important;
            height: 55px; box-sizing: border-box; align-items: center;
        }
        .navbar.estilo-cajas .logo img { height: 45px; }

        /* =========================================================
           CONTENEDOR DE CUENTA Y PERFIL
           ========================================================= */
        .main-content { display: flex; justify-content: center; padding: 40px 20px; }
        
        .account-card {
            background: var(--card-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border); border-radius: 30px;
            width: 100%; max-width: 500px; padding: 40px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            transition: var(--transition); position: relative; overflow: hidden;
        }

        /* TABS PARA LOGIN / REGISTRO */
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 15px; }
        .tab-btn { flex: 1; padding: 12px; border-radius: 10px; cursor: pointer; border: none; background: transparent; color: var(--text); font-weight: bold; transition: var(--transition); }
        .tab-btn.active { background: var(--accent); color: #000; }

        .profile-pic-large { width: 130px; height: 130px; border-radius: 50%; border: 4px solid var(--accent); object-fit: cover; margin-bottom: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 13px; opacity: 0.7; margin-bottom: 5px; }
        input, textarea {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--card-border);
            background: rgba(0,0,0,0.2); color: #fff; font-family: inherit; box-sizing: border-box; transition: 0.3s;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); background: rgba(0,0,0,0.4); }
        textarea { height: 80px; resize: none; }

        .btn-action { padding: 12px 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 10px; }
        .btn-save { background: var(--accent); color: #000; }
        .btn-save:hover { transform: translateY(-3px); box-shadow: 0 5px 15px var(--shadow-glow); }
        .btn-edit { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--card-border); }
        .btn-edit:hover { background: rgba(255,255,255,0.2); }
        .btn-danger { background: rgba(255,0,0,0.2); color: #ff5555; border: 1px solid rgba(255,0,0,0.3); }
        .btn-danger:hover { background: rgba(255,0,0,0.4); color: #fff; }

        /* REDES SOCIALES EN PERFIL */
        .social-links-display { display: flex; justify-content: center; gap: 15px; margin: 15px 0 25px 0; }
        .social-badge {
            background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 20px;
            color: #fff; text-decoration: none; font-size: 14px; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s;
        }

        /* MENÚ LATERAL */
        #sideMenu { position: fixed; top: 0; right: -320px; width: 300px; height: 100vh; background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(25px); border-left: 1px solid var(--card-border); padding: 30px 20px; display: flex; flex-direction: column; gap: 20px; transition: right 0.5s; z-index: 4000; }
        #sideMenu.show { right: 0; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.6); opacity: 0; visibility: hidden; z-index: 3500; transition: 0.3s; }
        #overlay.show { opacity: 1; visibility: visible; }
        .menu-item { padding: 15px; border-radius: 12px; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.05); text-align: left; font-weight: bold; }
        .menu-item:hover { background: var(--accent); color: #000; transform: translateX(10px); }

        .reveal { opacity: 0; transform: translateY(30px); transition: 0.6s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* =========================================================
           📱 MOTOR RESPONSIVO MÓVIL (NAVBAR APILADA)
           ========================================================= */
        @media screen and (max-width: 768px) {
            :root { --nav-height: 110px; }
            .navbar { 
                flex-direction: column !important; justify-content: center !important;
                padding: 10px 5px 8px 5px !important; height: auto !important; min-height: 90px;
            }
            .logo { font-size: 20px !important; margin-bottom: 8px !important; gap: 8px !important; width: 100%; justify-content: center; }
            .logo img { height: 35px !important; }
            .nav-links { width: 100%; justify-content: center !important; flex-wrap: wrap !important; gap: 4px !important; padding: 0 !important; }
            .nav-links a { font-size: 11px !important; padding: 6px 8px !important; border-radius: 8px !important; }
            #avatarNav { width: 32px !important; height: 32px !important; margin-left: 5px; }

            .navbar.estilo-cajas { top: 5px !important; }
            .navbar.estilo-cajas .logo {
                height: 40px !important; margin-bottom: 8px !important; background: rgba(40, 40, 40, 0.4) !important;
                border: 1px solid var(--card-border) !important; border-radius: 20px !important;
                width: auto !important; padding: 0 20px !important; display: inline-flex !important;
            }
            .navbar.estilo-cajas .nav-links { padding: 6px !important; border-radius: 15px !important; height: auto !important; }
            .navbar.estilo-cajas .logo img { height: 28px !important; }

            .main-content { padding: 20px 15px !important; }
            .account-card { padding: 25px 20px !important; border-radius: 20px !important; }
            .profile-pic-large { width: 100px !important; height: 100px !important; }
            #displayName { font-size: 24px !important; }
        }
    </style>
</head>
<body>

    <div class="navbar" id="mainNavbar">
        <a href="index.html" class="logo">
            <img src="zioxos_logo.png" alt="ZioX">
            <span>ZioXOS</span>
        </a>
        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="Descargas.html">Descargas</a>
            <a href="Documentos.html">Documentos</a>
            <a href="Comunidades.html">Comunidades</a>
            <a href="Novedades.html">Novedades</a>
            <a href="Ayuda.html">Ayuda</a>
            <a href="Cuenta.html" class="active" id="linkCuenta">👤 Cuenta</a>
            <img id="avatarNav" src="avatar_default.png"> 
        </div>
    </div>

    <div id="overlay"></div>
    <div id="sideMenu">
        <div class="menu-header" style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
            <img id="menuAvatar" src="avatar_default.png" alt="Avatar" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent);">
            <span id="menuUsername" style="font-weight: bold; font-size: 18px;">Cargando...</span>
        </div>
        <div class="menu-item" onclick="toggleTheme()">🌙 Cambiar Tema</div>
        <div class="menu-item" onclick="toggleNavbarAnimation()">✨ Línea de Neón</div>
        <div class="menu-item" onclick="toggleNavbarShape()">🔲 Forma de Cápsulas</div>
        <div class="menu-item" onclick="logout()">🚪 Cerrar Sesión</div>
    </div>

    <div class="main-content">
        <div class="account-card reveal" id="card">
            
            <div id="authPanel" style="display: none;">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('login')">Entrar</button>
                    <button class="tab-btn" onclick="switchTab('register')">Unirse</button>
                </div>
                <h2 id="authTitle" style="margin-bottom: 25px;">Bienvenido a ZioX</h2>
                
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="emailInput" placeholder="tu@ejemplo.com">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="passwordInput" placeholder="••••••••">
                </div>

                <button class="btn-action btn-save" id="btnMainAuth" onclick="handleAuth()">Iniciar Sesión</button>
                <p id="authSwitchText" style="margin-top: 20px; font-size: 14px; opacity: 0.6;">
                    ¿Nuevo en el sistema? <span style="color: var(--accent); cursor: pointer; font-weight: bold;" onclick="switchTab('register')">Crea una cuenta</span>
                </p>
            </div>

            <div id="profileView" style="display: none;">
                <img id="displayPic" src="avatar_default.png" class="profile-pic-large">
                <h2 id="displayName" style="margin: 0; font-size: 32px; color: var(--text); text-shadow: 0 2px 10px rgba(0,0,0,0.5);">Cargando...</h2>
                <p id="displayBio" style="opacity: 0.8; font-style: italic; margin: 15px 0;">Analizando datos...</p>
                
                <div class="social-links-display" id="socialLinksDiv"></div>

                <button class="btn-action btn-edit" onclick="toggleEditMode()">⚙️ Editar Perfil</button>
                <button class="btn-action btn-danger" onclick="logout()">🚪 Cerrar Sesión</button>
            </div>

            <div id="editView" style="display: none; border-top: none; margin-top: 0; padding-top: 0;">
                <h3 style="margin-top: 0; color: var(--accent);">Configuración del Núcleo</h3>
                
                <div class="form-group">
                    <label>Nombre de Usuario</label>
                    <input type="text" id="editUsername" placeholder="Ej: ZioX_Master">
                </div>
                <div class="form-group">
                    <label>Sobre mí (Biografía)</label>
                    <textarea id="editBio" placeholder="Escribe algo sobre ti..."></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group"><label>Link YouTube</label><input type="text" id="ytLink" placeholder="https://youtube.com/..."></div>
                    <div class="form-group"><label>Usuario Discord</label><input type="text" id="dcLink" placeholder="Usuario#1234"></div>
                </div>
                <div class="form-group">
                    <label>Actualizar Foto de Perfil</label>
                    <input type="file" id="fileInput" accept="image/*" style="font-size: 13px; padding: 8px;">
                </div>

                <button class="btn-action btn-save" id="btnSaveData" onclick="saveProfile()">💾 Guardar Cambios</button>
                <button class="btn-action btn-edit" onclick="toggleEditMode()">❌ Cancelar</button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="Menus.js"></script>
    <script>
        const supabaseClient = supabase.createClient("https://xcfpfdlkiistpugwflrz.supabase.co", "sb_publishable_tSoaoSQ_a7EQy--0_glOhw_0IT9ztX1");
        let currentUser = null;
        let currentAuthMode = 'login'; // 'login' o 'register'

        async function init() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            
            if (!user) {
                // MODO: NO AUTENTICADO
                document.getElementById('authPanel').style.display = 'block';
                document.getElementById('linkCuenta').style.display = 'inline-block';
                document.getElementById('avatarNav').style.display = 'none';
            } else {
                // MODO: AUTENTICADO
                currentUser = user;
                document.getElementById('profileView').style.display = 'block';
                document.getElementById('linkCuenta').style.display = 'none';
                document.getElementById('avatarNav').style.display = 'block';
                loadProfile();
            }
            
            document.querySelector('.reveal').classList.add('active');
        }

        // ==========================================
        // LÓGICA DE LOGIN / REGISTRO
        // ==========================================
        function switchTab(mode) {
            currentAuthMode = mode;
            const btns = document.querySelectorAll('.tab-btn');
            const title = document.getElementById('authTitle');
            const btnMain = document.getElementById('btnMainAuth');
            const switchText = document.getElementById('authSwitchText');
            
            btns[0].classList.toggle('active', mode === 'login');
            btns[1].classList.toggle('active', mode === 'register');

            if (mode === 'login') {
                title.innerText = 'Bienvenido a ZioX';
                btnMain.innerText = 'Iniciar Sesión';
                switchText.innerHTML = `¿Nuevo en el sistema? <span style="color: var(--accent); cursor: pointer; font-weight: bold;" onclick="switchTab('register')">Crea una cuenta</span>`;
            } else {
                title.innerText = 'Únete a ZioXOS';
                btnMain.innerText = 'Crear Cuenta';
                switchText.innerHTML = `¿Ya tienes cuenta? <span style="color: var(--accent); cursor: pointer; font-weight: bold;" onclick="switchTab('login')">Inicia sesión</span>`;
            }
        }

        async function handleAuth() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const btnMain = document.getElementById('btnMainAuth');

            if (!email || !password) {
                alert("Por favor, llena ambos campos.");
                return;
            }

            btnMain.innerText = "⏳ Procesando...";
            btnMain.disabled = true;

            if (currentAuthMode === 'login') {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    alert("Error: Verifica tus datos.");
                    btnMain.innerText = 'Iniciar Sesión';
                    btnMain.disabled = false;
                } else {
                    location.reload(); // Recarga y entra al perfil
                }
            } else {
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    alert("Error al registrarse: " + error.message);
                    btnMain.innerText = 'Crear Cuenta';
                    btnMain.disabled = false;
                } else {
                    alert("¡Cuenta creada! Revisa tu correo o inicia sesión ahora.");
                    switchTab('login');
                    document.getElementById('passwordInput').value = '';
                    btnMain.disabled = false;
                }
            }
        }

        // ==========================================
        // LÓGICA DEL PERFIL (Carga y Guardado)
        // ==========================================
        async function loadProfile() {
            const localUser = localStorage.getItem('ziox_user') || "Usuario ZioX";
            const localBio = localStorage.getItem('ziox_bio') || "Este usuario no ha escrito una biografía aún.";
            const localYt = localStorage.getItem('ziox_yt') || "";
            const localDc = localStorage.getItem('ziox_dc') || "";
            const localPic = localStorage.getItem('ziox_pic') || "avatar_default.png";

            updateUI(localUser, localBio, localYt, localDc, localPic);

            try {
                const { data: profile } = await supabaseClient.from('profiles').select('*').eq('user_id', currentUser.id).maybeSingle();
                const cloudPicUrl = `https://xcfpfdlkiistpugwflrz.supabase.co/storage/v1/object/public/avatars/${currentUser.id}/avatar.png?t=${Date.now()}`;
                
                if (profile) {
                    updateUI(profile.username, profile.bio, profile.youtube, profile.discord, cloudPicUrl);
                    localStorage.setItem('ziox_user', profile.username || "");
                    localStorage.setItem('ziox_bio', profile.bio || "");
                    localStorage.setItem('ziox_yt', profile.youtube || "");
                    localStorage.setItem('ziox_dc', profile.discord || "");
                    localStorage.setItem('ziox_pic', cloudPicUrl);
                }
            } catch (err) { console.log("Cargando en modo offline."); }
        }

        function updateUI(username, bio, yt, dc, picUrl) {
            document.getElementById('displayName').innerText = username;
            if(document.getElementById('menuUsername')) document.getElementById('menuUsername').innerText = username;
            document.getElementById('displayBio').innerText = bio;
            
            document.getElementById('editUsername').value = username;
            document.getElementById('editBio').value = bio;
            document.getElementById('ytLink').value = yt;
            document.getElementById('dcLink').value = dc;

            document.getElementById('displayPic').src = picUrl;
            document.getElementById('avatarNav').src = picUrl;
            if(document.getElementById('menuAvatar')) document.getElementById('menuAvatar').src = picUrl;

            const socialDiv = document.getElementById('socialLinksDiv');
            socialDiv.innerHTML = "";
            if (yt) {
                let ytUrl = yt.startsWith('http') ? yt : 'https://' + yt;
                socialDiv.innerHTML += `<a href="${ytUrl}" target="_blank" class="social-badge">📺 YouTube</a>`;
            }
            if (dc) {
                socialDiv.innerHTML += `<span class="social-badge">💬 ${dc}</span>`;
            }
        }

        function toggleEditMode() {
            const view = document.getElementById('profileView');
            const edit = document.getElementById('editView');
            if (view.style.display === 'none') {
                view.style.display = 'block';
                edit.style.display = 'none';
            } else {
                view.style.display = 'none';
                edit.style.display = 'block';
            }
        }

        async function saveProfile() {
            const username = document.getElementById('editUsername').value.trim();
            const bio = document.getElementById('editBio').value.trim();
            const youtube = document.getElementById('ytLink').value.trim();
            const discord = document.getElementById('dcLink').value.trim();
            const file = document.getElementById('fileInput').files[0];

            const btnSave = document.getElementById('btnSaveData');
            btnSave.innerText = "⏳ Guardando...";
            btnSave.disabled = true;

            localStorage.setItem('ziox_user', username);
            localStorage.setItem('ziox_bio', bio);
            localStorage.setItem('ziox_yt', youtube);
            localStorage.setItem('ziox_dc', discord);
            
            let currentPic = document.getElementById('displayPic').src;

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentPic = e.target.result;
                    localStorage.setItem('ziox_pic', currentPic);
                    updateUI(username, bio, youtube, discord, currentPic);
                };
                reader.readAsDataURL(file);
            } else {
                updateUI(username, bio, youtube, discord, currentPic);
            }

            const profileData = { user_id: currentUser.id, username, bio, youtube, discord };
            const { data: existingProfile } = await supabaseClient.from('profiles').select('user_id').eq('user_id', currentUser.id).maybeSingle();
            
            if (existingProfile) {
                await supabaseClient.from('profiles').update(profileData).eq('user_id', currentUser.id);
            } else {
                await supabaseClient.from('profiles').insert([profileData]);
            }

            if (file) {
                await supabaseClient.storage.from('avatars').upload(`${currentUser.id}/avatar.png`, file, { upsert: true });
            }

            btnSave.innerText = "💾 Guardar Cambios";
            btnSave.disabled = false;
            toggleEditMode(); 
        }

        async function logout() {
            localStorage.clear();
            await supabaseClient.auth.signOut();
            window.location.reload(); // Recarga la página y mostrará el formulario de login
        }

        // Funciones de Navbar
        function toggleNavbarAnimation() { document.getElementById('mainNavbar').classList.toggle('estilo-animado'); }
        function toggleNavbarShape() { document.getElementById('mainNavbar').classList.toggle('estilo-cajas'); }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
